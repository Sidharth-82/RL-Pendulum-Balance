<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" role="img" aria-label="Command reversals during the hold. Share of consecutive control steps that flip the command sign, over the last 2 s. High values are the limit cycle; it is invisible in the return.">
<style>.r { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; }@media (prefers-color-scheme: dark) { .r { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; } }.bg { fill: var(--surface); }.grid { stroke: var(--grid); stroke-width: 1; }.axis { stroke: var(--axis); stroke-width: 1; }.rule { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }.rule-label { fill: var(--muted); font-size: 10.5px; text-anchor: start; }.tick { fill: var(--muted); font-size: 11px; }.ty { text-anchor: end; } .tx { text-anchor: middle; }.axis-title { fill: var(--muted); font-size: 11.5px; text-anchor: middle; }.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }.line.dashed { stroke-dasharray: 5 4; }.dot { stroke: var(--surface); stroke-width: 2; }.direct { font-size: 11.5px; font-weight: 600; }.s1 { stroke: var(--s1); } .s2 { stroke: var(--s2); } .s3 { stroke: var(--s3); }circle.s1 { fill: var(--s1); } circle.s2 { fill: var(--s2); } circle.s3 { fill: var(--s3); }text.s1 { fill: var(--s1); stroke: none; }text.s2 { fill: var(--s2); stroke: none; }text.s3 { fill: var(--s3); stroke: none; }rect.s1 { fill: var(--s1); } rect.s2 { fill: var(--s2); } rect.s3 { fill: var(--s3); }.t { fill: var(--ink); font-size: 15px; font-weight: 620; }.st { fill: var(--ink2); font-size: 11.5px; }.lg { fill: var(--ink2); font-size: 11.5px; }svg { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }</style>
